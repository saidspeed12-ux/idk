<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>برنامج اداره المحل</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div>
         <div id="head"><h1>برنامج اداره المحل</h1></div>
         <h2 id="hed">اضافه منتج</h2>
         <div id="idk"><form><input type="text" id="name"
         placeholder="اسم المنتج">
         <br><br>
          <input type="number" id="buy"
         placeholder="سعر الشراء">
          
         <input type="number" id="sell"
         placeholder="سعر البيع">
         
         <input type="number" id="amount"
        placeholder="الكميه"></div>
        <br><br>
        <button id="but">اضافه </button>
        </form>

    </div>
    <div>
        <h2>البحث عن المنتج</h2>
         <input type="text" id="search"
         placeholder="اكتب اسم المنتج">

    </div>
   <table id="table">
     <tr>
        <th>الاسم</th>
        <th>السعر</th>
        <th>سعر البيع</th>
        <th>الكميه</th>
        <th>بيع</th>
        <th>تعديل</th>
        <th>مسح</th>
     </tr>
        <h3>إجمالي الأرباح: <span id="totalProfit">0</span> جنيه</h3>

     <tbody id="tbody">
     </tbody>
    <br> 
    <br>
    <br>
    <div id="calculator">
    <h2>🧮 الآلة الحاسبة</h2>

    <input type="number" id="calcNum1" placeholder="الرقم الأول">

    <select id="calcOperation">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
    </select>

    <input type="number" id="calcNum2" placeholder="الرقم الثاني">

    <button id="calcButton">احسب</button>

    <h3 id="calcResult">النتيجة: 0</h3>
    </div>
    <script src="main.js" defer></script>
</body>
</html>
